name: Release
on:
  push:
    tags:
      - "v*"
jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        # https://github.com/cli/cli/issues/9558
        with:
          ref: ${{ github.ref }}
      - name: Generate Notes
        run: |
          mkdir -p build
          git tag -l --format='%(contents:body)' "${{github.ref_name}}" > build/notes.md
          echo >> build/notes.md
          echo "[Build log](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> build/notes.md
      - name: Create Release
        run: gh release create --notes-file build/notes.md "${{github.ref_name}}"
        env:
          GH_TOKEN: ${{ github.token }}
  build:
    name: Build
    needs: create-release
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        os: ["macos", "linux"]
        arch: ["arm64", "amd64"]
      fail-fast: false
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.6"
      - name: Test
        run: go test -v ./...
      - name: Build
        env:
          OS: ${{ matrix.os }}
          ARCH: ${{ matrix.arch }}
          REF: ${{ github.ref_name }}
        run: "./.github/workflows/build.sh"
      - name: Upload
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{github.ref_name}}" build/cftest-${{matrix.os}}-${{matrix.arch}}-${{github.ref_name}}.tgz
